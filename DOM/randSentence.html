<!DOCTYPE html>
<html lang="en-us">
    <head>
        <title>Random Sentence Generator</title>
        <script src="randSentence.js" defer></script>
        <link rel="stylesheet" type="text/css" href="randSentence.css">
    </head>
    <body>
        <div class="center">
            <h1>Generate a random sentence</h1>
            <p>Either input words into the boxes or generate from a predetermined list</p>
            <div>
                <textarea id="adjectives" cols="50" placeholder="Type adjectives here..."></textarea>
                <br>
                <textarea id="nouns" cols="50" placeholder="Type nouns here..."></textarea>
                <br>
                <textarea id="verbs" cols="50" placeholder="Type verbs here..."></textarea>
                <br>
                <textarea id="adverbs" cols="50" placeholder="Type adverbs here..."></textarea>
            </div>
            <button id="senButton" type="button">Generate Sentence</button>
            <h2 id="senDisplay"></h2>
        </div>
    </body>
</html>
